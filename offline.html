<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171915">
  <title>Sem conexão · Los Santos Reader</title>
  <link rel="icon" type="image/png" href="./assets/pwa/favicon-48.png">
  <link rel="apple-touch-icon" href="./assets/pwa/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root{color-scheme:dark;--night:#171915;--sand:#D8C69F;--grove:#66744F;--muted:#AAA99C}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#66744F22,transparent 58%),var(--night);color:#f2efe7;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,460px);padding:40px 32px;text-align:center;border:1px solid #D8C69F22;border-radius:22px;background:linear-gradient(145deg,#20231D,#292D25);box-shadow:0 24px 70px #0007}.mark{width:88px;height:88px;object-fit:cover;border-radius:22px;margin-bottom:18px}.eyebrow{margin:0;color:var(--sand);font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{margin:8px 0 12px;font-size:clamp(2rem,8vw,2.6rem);line-height:1.05}p{margin:0 auto 24px;max-width:34ch;color:var(--muted)}button{border:1px solid #78875D40;border-radius:12px;padding:12px 20px;background:var(--grove);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.12)}
  </style>
</head>
<body>
  <main class="card">
    <img class="mark" src="./assets/pwa/icon-192.png" alt="">
    <p class="eyebrow">Los Santos Reader</p>
    <h1>Você está sem conexão</h1>
    <p>Reconecte-se à internet para acessar sua biblioteca, sua conta e sincronizar seu progresso. Depois, tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
<script src="./js/pwa.js" defer></script></body>
</html>
