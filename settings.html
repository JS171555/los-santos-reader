<!doctype html><html lang="pt-BR"><head><title>Configurações · Los Santos Reader</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121212"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="48x48" href="./assets/pwa/favicon-48.png"><link rel="apple-touch-icon" href="./assets/pwa/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Los Santos Reader"><meta name="msapplication-TileColor" content="#121212"><meta name="msapplication-TileImage" content="./assets/pwa/mstile-150.png"><meta name="theme-color" content="#121212"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdnjs.cloudflare.com"><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Figtree:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/styles.css"></head><body><div class="shell"><nav class="side" id="side" aria-label="Principal"></nav>
<main class="wide"><h1>Configurações</h1>
<section class="card sect"><h3>Perfil</h3><div class="head" style="margin-bottom:1rem"><div id="avprev"></div><div><label class="btn ghost" for="af" style="cursor:pointer"><i class="fa-solid fa-camera"></i>Alterar foto</label><input id="af" type="file" accept="image/jpeg,image/png,image/webp" hidden> <button class="btn ghost" id="rm" type="button">Remover foto</button><p class="sub" style="margin:.6rem 0 0">JPG, PNG ou WebP, até 2 MB.</p></div></div>
<form id="f-name"><div class="field"><label for="n">Nome de usuário</label><input class="input" id="n" name="n" maxlength="40" required></div><button class="btn" type="submit">Salvar nome</button></form></section>
<section class="card sect"><h3>Alterar senha</h3><form id="f-pw"><div class="field"><label for="p1">Nova senha (mín. 8 caracteres)</label><input class="input" id="p1" name="p1" type="password" autocomplete="new-password" required></div><div class="field"><label for="p2">Confirmar senha</label><input class="input" id="p2" name="p2" type="password" autocomplete="new-password" required></div><button class="btn" type="submit">Alterar senha</button></form></section>
<section class="card sect"><h3>Privacidade</h3><form id="f-priv"><div class="checks" style="flex-direction:column"><label><input type="checkbox" id="pp" name="pp">Perfil público (desmarcado, você aparece como "Leitor anônimo" no ranking)</label><label><input type="checkbox" id="sr" name="sr">Participar do ranking</label></div><button class="btn" type="submit">Salvar privacidade</button></form></section>
<section class="card sect"><h3>Preferências de leitura</h3><form id="f-read"><div class="field"><label for="rt">Tema do leitor</label><select class="input" id="rt" name="rt"><option value="dark">Escuro</option><option value="light">Claro</option></select></div><div class="field"><label for="rf">Ajuste inicial da página</label><select class="input" id="rf" name="rf"><option value="width">À largura</option><option value="height">À altura</option></select></div><button class="btn" type="submit">Salvar preferências</button></form></section>
<section class="card sect"><h3>Notificações</h3><form id="f-not"><div class="checks" style="flex-direction:column"><label><input type="checkbox" id="na" name="na">Avisos de conquistas e níveis</label><label><input type="checkbox" id="nx" name="nx">Animação de XP ao ler</label></div><button class="btn" type="submit">Salvar notificações</button></form></section>
<section class="card sect"><h3>Sessão</h3><button class="btn danger" id="out3" type="button"><i class="fa-solid fa-right-from-bracket"></i>Encerrar sessão</button></section></main></div><script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script defer src="js/config.js"></script><script defer src="js/ui.js"></script><script defer src="js/auth.js"></script><script defer src="js/shell.js"></script><script defer src="js/data.js"></script><script defer src="js/rewards.js"></script><script defer src="js/pages/settings.js"></script><script src="./js/pwa.js" defer></script></body></html>
