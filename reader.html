<!doctype html><html lang="pt-BR"><head><title>Leitor · Los Santos Reader</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Figtree:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/styles.css"></head>
<body class="reader" data-theme="dark">
<header class="rbar">
 <div class="reader-head"><a class="ib" id="back" href="app.html" aria-label="Voltar" style="display:grid;place-items:center;text-decoration:none"><i class="fa-solid fa-arrow-left"></i></a><div class="reader-title"><span class="reader-kicker">LEITOR PDF</span><strong class="rt" id="rt"></strong></div></div>
 <div class="rctl" aria-label="Controles do leitor">
  <div class="tool-group page-controls" role="group" aria-label="Navegação de páginas"><button class="ib" id="pv" aria-label="Página anterior"><i class="fa-solid fa-chevron-left"></i></button><input class="input pg" id="pi" type="number" min="1" aria-label="Página atual"><span id="pt"></span><button class="ib" id="nx" aria-label="Próxima página"><i class="fa-solid fa-chevron-right"></i></button></div>
  <div class="tool-group zoom-controls" role="group" aria-label="Zoom e ajuste da página"><button class="ib" id="zo" aria-label="Diminuir zoom"><i class="fa-solid fa-magnifying-glass-minus"></i></button><span id="zl" aria-live="polite"></span><button class="ib" id="zi" aria-label="Aumentar zoom"><i class="fa-solid fa-magnifying-glass-plus"></i></button><span class="tool-divider" aria-hidden="true"></span><button class="ib" id="fw" aria-label="Ajustar à largura" title="Ajustar à largura"><i class="fa-solid fa-arrows-left-right"></i></button><button class="ib" id="fh" aria-label="Ajustar à altura" title="Ajustar à altura"><i class="fa-solid fa-arrows-up-down"></i></button></div>
  <div class="tool-group utility-controls" role="group" aria-label="Ferramentas do livro"><button class="ib" id="bm" aria-label="Marcar página" aria-pressed="false"><i class="fa-regular fa-bookmark"></i></button><button class="ib" id="bl" aria-label="Meus marcadores"><i class="fa-solid fa-list"></i></button><button class="ib" id="th" aria-label="Alternar tema"><i class="fa-solid fa-circle-half-stroke"></i></button><button class="ib" id="fs" aria-label="Tela cheia"><i class="fa-solid fa-expand"></i></button></div>
 </div>
</header>
<div class="prog"><i id="pb"></i></div><div class="stage" id="stage"><div class="sk" id="rsk" style="margin:auto;width:min(80%,420px);aspect-ratio:2/3"></div><canvas id="cv" hidden></canvas></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/config.js"></script><script src="js/ui.js"></script><script src="js/auth.js"></script><script src="js/data.js"></script><script src="js/rewards.js"></script><script src="js/pages/reader.js"></script></body></html>
